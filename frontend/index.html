<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK Age Verifier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Zero-Knowledge Age Verifier</h1>
            <p class="subtitle">Prove you're over 18 without revealing your birth year</p>
        </header>

        <div class="main-content">
            <div class="section">
                <h2>📅 Your Birth Year</h2>
                <div class="input-group">
                    <input type="number" id="birthYear" placeholder="YYYY" min="1900" max="2024">
                </div>
            </div>

            <div class="section">
                <h2>📅 Current Year</h2>
                <div class="input-group">
                    <input type="number" id="currentYear" placeholder="YYYY">
                </div>
            </div>

            <div class="actions">
                <button id="generateProofBtn" class="btn-primary" disabled>
                    ⏳ Loading...
                </button>
                <button id="verifyProofBtn" class="btn-secondary" disabled>
                    ✅ Verify Proof
                </button>
            </div>

            <div id="status" class="status"></div>
            
            <div id="proofDetails" class="proof-details" style="display: none;">
                <h3>📋 Proof Generated</h3>
                <div class="detail-item">
                    <strong>Birthday Hash:</strong>
                    <code id="birthdayHash"></code>
                </div>
                <div class="detail-item">
                    <strong>Public Signals:</strong>
                    <code id="publicSignals"></code>
                </div>
                <div class="detail-item">
                    <strong>Proof Size:</strong>
                    <span id="proofSize"></span>
                </div>
            </div>

            <div id="result" class="result" style="display: none;"></div>
        </div>

        <footer>
            <p>🔐 Your birth year never leaves your browser. Only a zero-knowledge proof is sent.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/snarkjs@0.7.0/build/snarkjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
